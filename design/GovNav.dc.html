<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav aria-label="Governance sections" style="display:block; background:#FFFFFF; border-bottom:1px solid #E2E9E6; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <div style="max-width:1280px; margin:0 auto; padding:0 clamp(20px,4vw,40px);">
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <ul style="display:flex; justify-content:center; flex-wrap:wrap; column-gap:32px; margin:0; padding:0; list-style:none;">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="3">
          <li style="display:flex;">
            <sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}"><a href="{{ it.href }}" aria-current="page" style="display:flex; align-items:center; min-height:56px; margin-bottom:-1px; border-bottom:3px solid #123039; font-size:15px; font-weight:700; color:#123039; text-decoration:none;" style-focus="outline:2px solid #12836B; outline-offset:-2px;">{{ it.t }}</a></sc-if>
            <sc-if value="{{ it.off }}" hint-placeholder-val="{{ true }}"><a href="{{ it.href }}" style="display:flex; align-items:center; min-height:56px; margin-bottom:-1px; border-bottom:3px solid transparent; font-size:15px; font-weight:500; color:#5C7075; text-decoration:none; transition:color .2s ease, border-color .2s ease;" style-hover="color:#123039; border-bottom-color:#D5E0DC;" style-focus="outline:2px solid #12836B; outline-offset:-2px;">{{ it.t }}</a></sc-if>
          </li>
        </sc-for>
      </ul>
    </sc-if>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <label style="display:flex; align-items:center; gap:10px; padding:12px 0;">
        <span style="flex:none; font-size:14px; font-weight:600; color:#5C7075;">Section</span>
        <span style="position:relative; flex:1; min-width:0; display:block;">
          <select value="{{ value }}" onChange="{{ go }}" style="appearance:none; -webkit-appearance:none; width:100%; min-height:48px; padding:10px 40px 10px 14px; border-radius:12px; border:1px solid #D5E0DC; background:#F7F9F8; font-family:inherit; font-size:16px; font-weight:600; color:#123039;">
            <sc-for list="{{ options }}" as="o" hint-placeholder-count="4">
              <option value="{{ o.href }}">{{ o.t }}</option>
            </sc-for>
          </select>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5C7075" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position:absolute; right:14px; top:50%; translate:0 -50%; pointer-events:none;"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </span>
      </label>
    </sc-if>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:80},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hub&quot;,&quot;board&quot;,&quot;leadership&quot;,&quot;framework&quot;],&quot;default&quot;:&quot;hub&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const SECTIONS = [
  { k: 'board', t: 'Board of Directors', href: 'Governance%20Board.dc.html' },
  { k: 'leadership', t: 'Leadership', href: 'Governance%20Leadership.dc.html' },
  { k: 'framework', t: 'Governance Framework / Documents', href: 'Governance.dc.html#framework' },
];
class Component extends DCLogic {
  state = { narrow: false };
  componentDidMount() {
    this._mq = window.matchMedia('(max-width:767px)');
    this._f = () => this.setState({ narrow: this._mq.matches });
    this._f();
    this._mq.addEventListener('change', this._f);
  }
  componentWillUnmount() { if (this._mq) this._mq.removeEventListener('change', this._f); }
  renderVals() {
    const cur = this.props.current || 'hub';
    const items = SECTIONS.map(s => ({ t: s.t, href: s.href, on: s.k === cur, off: s.k !== cur }));
    const options = (cur === 'hub' ? [{ t: 'Governance overview', href: 'Governance.dc.html' }] : []).concat(SECTIONS.map(s => ({ t: s.t, href: s.href })));
    const curS = SECTIONS.find(s => s.k === cur);
    return {
      wide: !this.state.narrow, narrow: this.state.narrow, items, options,
      value: curS ? curS.href : 'Governance.dc.html',
      go: (e) => { const v = e.target.value; if (v) location.href = v; },
    };
  }
}
</script>
</body>
</html>
