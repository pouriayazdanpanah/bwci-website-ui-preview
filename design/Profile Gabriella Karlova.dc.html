<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Gabriella Karlova — Better World Capital Investments PLC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&amp;family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;display=swap">
<style>
:root{
  --brand-ink:#123039; --brand-slate:#16323B; --brand-teal:#1D4A54;
  --accent-emerald:#12836B; --accent-emerald-dark:#0D6E59; --accent-gold:#B98F2D; --accent-gold-dark:#9E7720; --accent-blue:#3D5A80;
  --surface-canvas:#FFFFFF; --surface-subtle:#F7F9F8; --surface-cloud:#EFF3F1; --surface-dark:#123039; --surface-dark-elevated:#1D4A54;
  --text-primary:#123039; --text-secondary:#42585E; --text-muted:#5C7075; --text-disabled:#A0B0B4; --text-inverse:#FFFFFF; --text-inverse-muted:#A8C2C8;
  --border-subtle:#E2E9E6; --border-default:#D5E0DC; --border-strong:#8A9E99; --border-inverse:#2D5964;
  --status-op-mark:#12836B; --status-op-text:#0D6E59; --status-op-border:#A3D9C9; --status-op-bg:#E8F5F1;
  --status-dev-mark:#B98F2D; --status-dev-text:#7D5B0F; --status-dev-border:#E8C46B; --status-dev-bg:#FDF8EB;
  --status-pro-mark:#6C8085; --status-pro-text:#384C51; --status-pro-border:#BDCCD0; --status-pro-bg:#F0F4F5;
  --rel-partner-mark:#3D5A80; --rel-partner-text:#253B57; --rel-partner-border:#A8BDD7; --rel-partner-bg:#EFF4FA;
  --radius-sm:2px; --radius-md:4px; --radius-lg:8px; --radius-full:9999px;
  --shadow-card:0 1px 3px rgba(18,48,57,.04), 0 1px 2px rgba(18,48,57,.02);
  --shadow-elevated:0 4px 12px rgba(18,48,57,.08), 0 2px 4px rgba(18,48,57,.04);
  --font-sans:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  --container:1280px; --container-wide:1440px;
  --e:cubic-bezier(.2,.8,.2,1);
  --t-micro:180ms; --t-comp:250ms; --t-diag:500ms; --t-sys:800ms;
}
*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{ margin:0; background:var(--surface-canvas); color:var(--text-primary); font-family:var(--font-sans); font-size:max(15px,var(--fs-floor-body,0px)); line-height:1.65; -webkit-font-smoothing:antialiased; }
h1,h2,h3,h4,h5{ margin:0; color:var(--text-primary); } p{ margin:0; } ul,ol{ margin:0; padding:0; list-style:none; }
a{ color:var(--accent-emerald-dark); text-decoration:none; } a:hover{ color:var(--brand-ink); }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{ outline:2px solid var(--accent-emerald); outline-offset:2px; }
[id]{ scroll-margin-top:calc(var(--nav-h, 116px) - var(--util-h, 40px) + 16px); }
/* mobile type floors — mirrors bwci-system.css A2 */
:root{ --fs-floor-sm:0px; --fs-floor-body:0px; }
@media (max-width:767px){ :root{ --fs-floor-sm:14px; --fs-floor-body:16px; } }
/* hold paint until bwci-system.css applies (it sets .bw visible); 2.5s failsafe */
@keyframes bwShow{ to{ visibility:visible; } }
.bw{ visibility:hidden; animation:bwShow 0s 2.5s forwards; }
</style>
<link rel="stylesheet" href="./bwci-system.css">
<script src="./image-slot.js"></script>
<script src="./bwci-people.js"></script>
<script src="./bwci-motion.js"></script>
</helmet>
<div class="bw" ref="{{ rootRef }}" style="width:100%; min-height:100vh; background:var(--surface-canvas); overflow-x:clip">
  <dc-import name="SiteHeader" current="governance" style="position:sticky; top:calc(var(--util-h, 0px) * -1); z-index:60; display:block; width:100%" hint-size="100%,116px"></dc-import>
  <main id="main">
    <dc-import name="GovProfile" slug="gabriella-karlova" style="display:block" hint-size="100%,1400px"></dc-import>
  </main>
  <dc-import name="SiteFooter" style="display:block; width:100%" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  rootRef = React.createRef();
  componentDidMount() {
    const r = this.rootRef.current;
    if (!r || !('IntersectionObserver' in window)) return;
    r.classList.add('sr-on');
    this.io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); this.io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
    r.querySelectorAll('.sr').forEach((el) => this.io.observe(el));
  }
  componentWillUnmount() { if (this.io) this.io.disconnect(); }
  renderVals() {
    return { rootRef: this.rootRef };
  }
}
</script>
</body>
</html>
