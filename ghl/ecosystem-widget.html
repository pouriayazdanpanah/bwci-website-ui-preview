<div id="bwci-ecosystem-widget">

<style>

:host{
  --brand-ink:#123039; --brand-slate:#16323B; --brand-teal:#1D4A54;
  --accent-emerald:#12836B; --accent-emerald-dark:#0D6E59; --accent-gold:#B98F2D; --accent-gold-dark:#9E7720; --accent-blue:#3D5A80;
  --surface-canvas:#FFFFFF; --surface-subtle:#F7F9F8; --surface-cloud:#EFF3F1; --surface-dark:#123039; --surface-dark-elevated:#1D4A54;
  --text-primary:#123039; --text-secondary:#42585E; --text-muted:#5C7075; --text-disabled:#A0B0B4; --text-inverse:#FFFFFF; --text-inverse-muted:#A8C2C8;

  --status-op-mark:#12836B; --status-op-text:#0D6E59; --status-op-border:#A3D9C9; --status-op-bg:#E8F5F1;
  --status-dev-mark:#B98F2D; --status-dev-text:#7D5B0F; --status-dev-border:#E8C46B; --status-dev-bg:#FDF8EB;
  --status-pro-mark:#6C8085; --status-pro-text:#384C51; --status-pro-border:#BDCCD0; --status-pro-bg:#F0F4F5;
  --rel-partner-mark:#3D5A80; --rel-partner-text:#253B57; --rel-partner-border:#A8BDD7; --rel-partner-bg:#EFF4FA;
  --radius-sm:2px; --radius-md:4px; --radius-lg:8px; --radius-full:9999px;
  --shadow-card:0 1px 3px rgba(18,48,57,.04), 0 1px 2px rgba(18,48,57,.02);
  --shadow-elevated:0 4px 12px rgba(18,48,57,.08), 0 2px 4px rgba(18,48,57,.04);
  --font-sans:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  --container:1280px; --container-wide:1440px;

}
*{ box-sizing:border-box; }

h1,h2,h3,h4{ margin:0; font-family:var(--font-sans); color:var(--text-primary); }
p{ margin:0; } ul{ margin:0; padding:0; list-style:none; }
a{ color:inherit; text-decoration:none; }

button{ font-family:inherit; cursor:pointer; background:none; border:none; padding:0; color:inherit; text-align:inherit; }
:focus-visible{ outline:2px solid var(--accent-emerald); outline-offset:2px; }
.container{ max-width:var(--container); margin:0 auto; padding:0 32px; }
.section{ padding:clamp(56px,6vw,88px) 0; position:relative; }
.eyebrow{ display:inline-flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-gold-dark); margin-bottom:16px; }
.eyebrow::before{ content:''; width:14px; height:1.5px; background:currentColor; }
.eyebrow--inv{ color:var(--accent-gold); }
.h-display{ font-size:clamp(34px,4.6vw,56px); font-weight:700; line-height:1.12; letter-spacing:-.03em; }
.h1{ font-size:clamp(28px,3.6vw,44px); font-weight:700; line-height:1.18; letter-spacing:-.025em; }
.h3{ font-size:clamp(19px,2vw,24px); font-weight:600; line-height:1.33; letter-spacing:-.015em; }
.body-lg{ font-size:clamp(16px,1.4vw,18px); line-height:1.6; color:var(--text-secondary); }
.body{ font-size:15px; line-height:1.65; color:var(--text-secondary); }
.body-sm{ font-size:13px; line-height:1.55; color:var(--text-muted); }
.mono{ font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
.sec-head{ max-width:720px; margin-bottom:clamp(32px,3.6vw,48px); }
.sec-head .body-lg{ margin-top:14px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:12px 24px; border-radius:var(--radius-md); font-size:14px; font-weight:600; letter-spacing:.01em; white-space:nowrap; border:1px solid transparent; transition:background-color var(--t-micro), border-color var(--t-micro), color var(--t-micro); }
.btn--primary{ background:var(--accent-emerald); color:#fff; border-color:var(--accent-emerald); }
.btn--primary:hover{ background:var(--accent-emerald-dark); color:#fff; }
.btn--inverse{ background:#fff; color:var(--brand-ink); border-color:#fff; }

.text-link--inv{ color:#fff; border-color:rgba(255,255,255,.4); }
.text-link--inv:hover{ color:var(--accent-gold); border-color:var(--accent-gold); }
.icon{ width:16px; height:16px; stroke:currentColor; stroke-width:1.5; fill:none; }
.svg-mono{ font-family:var(--font-mono); font-weight:600; letter-spacing:.08em; }

/* status glyphs (never colour alone) */
.st{ display:inline-flex; align-items:center; gap:7px; font-family:var(--font-mono); font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
.st-g{ flex:none; width:10px; height:10px; border-radius:50%; box-sizing:border-box; display:inline-block; }
.st--op .st-g{ background:var(--status-op-mark); border:1.5px solid var(--status-op-mark); } .st--op{ color:var(--status-op-text); }
.st--dev .st-g{ border:1.5px solid var(--status-dev-mark); background:linear-gradient(90deg,var(--status-dev-mark) 50%,transparent 50%); } .st--dev{ color:var(--status-dev-text); }
.st--pro .st-g{ border:1.5px solid var(--status-pro-mark); } .st--pro{ color:var(--status-pro-text); }
.st--partner .st-g{ width:16px; height:6px; border-radius:0; background:linear-gradient(90deg,var(--rel-partner-mark) 0 5px,transparent 5px 11px,var(--rel-partner-mark) 11px) , linear-gradient(var(--rel-partner-mark),var(--rel-partner-mark)) center/100% 1.5px no-repeat; } .st--partner{ color:var(--rel-partner-text); }
.st--none .st-g{ border:1.5px dashed var(--border-strong); } .st--none{ color:var(--text-muted); }

/* reveal */
.rv{ opacity:0; transform:translateY(14px); transition:opacity var(--t-sys) var(--e), transform var(--t-sys) var(--e); }
.rv-in{ opacity:1; transform:none; }

/* NAV */
.nav{ position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:8px; padding:16px 32px; background:rgba(255,255,255,.86); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-bottom:1px solid var(--border-subtle); }
.nav__logo{ display:flex; align-items:center; gap:10px; }
.nav__mark{ width:30px; height:30px; border-radius:var(--radius-sm); background:var(--brand-ink); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:.02em; }
.nav__word{ font-family:var(--font-mono); font-size:13px; font-weight:700; letter-spacing:.16em; color:var(--brand-ink); }
.nav__links{ display:flex; align-items:center; gap:28px; margin:0 0 0 56px; }
.nav__links a{ position:relative; font-size:14px; font-weight:500; color:var(--text-secondary); padding-bottom:4px; transition:color .18s; }
.nav__links a:hover{ color:var(--brand-ink); }
.nav__links a[aria-current="page"]{ color:var(--brand-ink); font-weight:600; }
.nav__links a[aria-current="page"]::after{ content:''; position:absolute; left:0; right:0; bottom:-2px; height:2px; background:var(--accent-emerald); border-radius:var(--radius-full); }
.nav__cta{ margin-left:auto; }
.nav__burger{ display:none; width:44px; height:44px; align-items:center; justify-content:center; border:1px solid var(--border-default); border-radius:var(--radius-md); background:#fff; margin-left:auto; }

/* HERO */
.hero{ position:relative; overflow:hidden; color:#fff; min-height:480px; display:flex; align-items:center;
  background:radial-gradient(ellipse 720px 620px at 88% 44%, rgba(18,131,107,.20), transparent 60%), radial-gradient(ellipse 560px 460px at -4% 82%, rgba(29,74,84,.30), transparent 60%), linear-gradient(180deg,#05090B 0%,#090F11 55%,#0B1416 100%); }
.hero::before{ content:''; position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(rgba(255,255,255,.08) 1px, transparent 1.6px); background-size:26px 26px; -webkit-mask-image:linear-gradient(90deg,black,transparent 60%); mask-image:linear-gradient(90deg,black,transparent 60%); }
.hero-inner{ position:relative; z-index:2; width:100%; max-width:var(--container-wide); margin:0 auto; padding:clamp(56px,6vw,80px) 50px; }
.hero-copy{ max-width:790px; }
.hero-copy .eyebrow{ margin-bottom:22px; }
.hero-copy .h-display{ color:var(--text-inverse); margin:0 0 20px; max-width:790px; }
.hero-copy .body-lg{ color:var(--text-inverse-muted); max-width:625px; margin-bottom:0; letter-spacing:-.005em; }
.hero-actions{ display:flex; flex-wrap:wrap; gap:14px; margin-top:32px; }
.hero-btn{ display:inline-flex; align-items:center; gap:12px; min-height:44px; padding:0 22px; border-radius:2px; font-family:var(--font-mono); font-size:11.5px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; text-decoration:none; border:1px solid transparent; transition:background-color .18s, border-color .18s, color .18s; }
.hero-btn--solid{ background:#F1EEE6; color:var(--brand-ink); border-color:#F1EEE6; }
.hero-btn--solid:hover{ background:#fff; color:var(--brand-ink); }
.hero-btn--ghost{ background:transparent; color:#fff; border-color:rgba(255,255,255,.55); }
.hero-btn--ghost:hover{ border-color:#fff; background:rgba(255,255,255,.06); color:#fff; }
.hero-frame{ position:absolute; left:40%; top:22%; width:28%; height:44%; border:1px solid rgba(255,255,255,.28); }
.hero-tick{ position:absolute; padding-left:10px; font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; color:rgba(255,255,255,.5); }
.hero-tick::before{ content:""; position:absolute; left:0; top:0; height:26px; border-left:1px dashed rgba(255,255,255,.35); }
.hero-meta{ display:flex; flex-wrap:wrap; gap:10px 28px; margin-top:40px; padding-top:20px; border-top:1px solid rgba(255,255,255,.12); max-width:540px; }
.hero-meta span{ font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--text-inverse-muted); display:inline-flex; gap:8px; align-items:center; }
.hero-meta b{ color:#fff; font-weight:700; }
.hero-img{ position:absolute; z-index:1; top:50%; right:-2%; width:min(64vw,1000px); transform:translateY(-50%); pointer-events:none; }
.hero-img img{ display:block; width:100%; height:auto; -webkit-user-select:none; user-select:none; }
.hero-net{ position:absolute; z-index:1; top:50%; right:clamp(-260px,-14vw,-60px); width:min(62vw,860px); aspect-ratio:1; transform:translateY(-50%); pointer-events:none; }
.hero-net svg{ width:100%; height:100%; display:block; overflow:visible; }
.hn-ring{ fill:none; stroke:rgba(255,255,255,.10); }
.hn-link{ stroke:rgba(255,255,255,.16); stroke-width:1; }
.hn-peri{ fill:rgba(255,255,255,.02); stroke:rgba(168,194,200,.38); stroke-dasharray:3 4; }
.hn-node{ fill:#A8C2C8; }
.hn-sub{ fill:rgba(168,194,200,.55); }
.hn-port{ fill:#0B1416; stroke:rgba(168,194,200,.6); }
.hn-label{ fill:rgba(168,194,200,.85); font-size:10px; }
.hn-coord{ fill:rgba(168,194,200,.4); font-size:8px; }
.hn-trace{ fill:none; stroke-width:1.6; stroke-dasharray:100; stroke-dashoffset:100; animation:hnTrace 9s var(--e) infinite; }
.hn-trace--b{ animation-delay:3s; } .hn-trace--c{ animation-delay:6s; }
@keyframes hnTrace{ 0%{ stroke-dashoffset:100; opacity:0; } 8%{ opacity:1; } 40%{ stroke-dashoffset:0; opacity:1; } 60%{ stroke-dashoffset:0; opacity:0; } 100%{ stroke-dashoffset:0; opacity:0; } }
.hn-pulse{ fill:none; stroke:var(--accent-emerald); transform-box:fill-box; transform-origin:center; animation:hnPulse 4.2s ease-out infinite; }
@keyframes hnPulse{ 0%{ transform:scale(.8); opacity:.7; } 100%{ transform:scale(1.9); opacity:0; } }

/* PRINCIPLE BAND */
.band{ background:var(--surface-canvas); border-bottom:1px solid var(--border-subtle); }
.band-grid{ display:grid; grid-template-columns:minmax(220px,.8fr) minmax(0,2fr); gap:clamp(32px,6vw,96px); align-items:start; padding:clamp(40px,5vw,64px) 0; }
.band-mark{ display:flex; flex-direction:column; gap:18px; }
.band-glyph{ width:112px; height:40px; }
.band-text{ font-size:clamp(17px,1.6vw,21px); line-height:1.6; color:var(--text-primary); font-weight:500; letter-spacing:-.005em; max-width:760px; }

/* 01 DIMENSIONS */
.dim{ background:linear-gradient(180deg,var(--surface-canvas),var(--surface-subtle)); }
.dim-frame{ position:relative; display:grid; grid-template-columns:44px minmax(0,1fr); gap:0 28px; }
.dim-spine{ position:relative; display:flex; justify-content:center; }
.dim-spine::before{ content:''; position:absolute; top:28px; bottom:28px; width:1.5px; background:var(--brand-ink); }
.dim-spine span{ position:sticky; top:40%; writing-mode:vertical-rl; transform:rotate(180deg); background:var(--surface-subtle); padding:12px 0; font-family:var(--font-mono); font-size:9.5px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--text-muted); z-index:1; align-self:center; }
.dim-rows{ display:flex; flex-direction:column; }
.dim-row{ position:relative; display:grid; grid-template-columns:150px minmax(200px,.8fr) minmax(0,2.2fr); gap:32px; align-items:center; padding:34px 0; border-top:1px solid var(--border-default); transition:background-color var(--t-comp); }
.dim-row:last-child{ border-bottom:1px solid var(--border-default); }
.dim-row::before{ content:''; position:absolute; left:-58px; top:50%; width:28px; height:1.5px; background:var(--brand-ink); }
.dim-row::after{ content:''; position:absolute; left:-34px; top:50%; width:9px; height:9px; margin-top:-4px; border-radius:50%; background:var(--surface-canvas); border:1.5px solid var(--brand-ink); transition:background-color var(--t-comp); }
.dim-row:hover::after{ background:var(--accent-emerald); border-color:var(--accent-emerald); }
.dim-plane{ position:relative; width:130px; height:84px; }
.dim-plane i{ position:absolute; left:10px; width:110px; height:44px; border:1px solid var(--border-strong); background:var(--surface-canvas); transform:skewX(-28deg) ; transition:transform var(--t-diag) var(--e), border-color var(--t-comp), background-color var(--t-comp); }
.dim-plane i:nth-child(1){ top:36px; opacity:.5; } .dim-plane i:nth-child(2){ top:20px; opacity:.75; } .dim-plane i:nth-child(3){ top:4px; }
.dim-plane b{ position:absolute; left:0; right:0; top:14px; text-align:center; font-family:var(--font-mono); font-size:22px; font-weight:700; color:var(--brand-ink); z-index:2; }
.dim-row:hover .dim-plane i:nth-child(3){ border-color:var(--accent-emerald); transform:skewX(-28deg) translateY(-6px); }
.dim-row:hover .dim-plane i:nth-child(1){ transform:skewX(-28deg) translateY(4px); }
.dim-code{ display:block; font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-gold-dark); margin-bottom:6px; }
.dim-title{ font-size:19px; font-weight:600; letter-spacing:-.015em; line-height:1.3; }
.dim-q{ display:block; font-size:13px; color:var(--text-muted); margin-top:4px; }
.dim-rail{ position:relative; display:grid; grid-template-columns:repeat(var(--n),minmax(0,1fr)); gap:12px; padding-top:22px; }
.dim-rail::before{ content:''; position:absolute; top:4px; left:0; right:0; height:1px; background:var(--border-strong); }
.dim-item{ position:relative; display:flex; flex-direction:column; gap:4px; }
.dim-item::before{ content:''; position:absolute; top:-22px; left:0; width:8px; height:8px; border-radius:50%; background:var(--surface-canvas); border:1.5px solid var(--brand-ink); transition:background-color var(--t-comp), transform var(--t-comp); }
.dim-row:hover .dim-item::before{ background:var(--brand-ink); }
.dim-item__code{ font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:.1em; color:var(--text-disabled); }
.dim-item__t{ font-size:12.5px; font-weight:600; line-height:1.35; color:var(--text-primary); }
.dim-item__s{ font-size:11.5px; color:var(--text-muted); line-height:1.4; }

/* 02 BLUEPRINT */
.bp-sec{ background:radial-gradient(ellipse 900px 600px at 40% 50%, rgba(29,74,84,.55), transparent 70%), linear-gradient(180deg,#0B1416 0%, var(--surface-dark) 100%); color:#fff; overflow:hidden; }
.bp-sec .h1{ color:#fff; } .bp-sec .body-lg{ color:var(--text-inverse-muted); }
.bp-lenses{ display:inline-grid; grid-template-columns:repeat(3,auto); border:1px solid var(--border-inverse); border-radius:var(--radius-md); overflow:hidden; margin-bottom:32px; background:rgba(255,255,255,.02); }
.bp-lens{ display:flex; flex-direction:column; gap:3px; padding:12px 20px; min-height:44px; color:var(--text-inverse-muted); border-left:1px solid var(--border-inverse); transition:background-color var(--t-comp), color var(--t-comp); }
.bp-lens:first-child{ border-left:none; }
.bp-lens span{ font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.7; }
.bp-lens strong{ font-size:13.5px; font-weight:600; }
.bp-lens:hover{ color:#fff; }
.bp-lens--on{ background:var(--accent-emerald); color:#fff; }
.bp-lens--on span{ opacity:.9; }
.bp-grid{ display:grid; grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr); gap:clamp(32px,4vw,56px); align-items:start; }
.bp-stage{ position:relative; border:1px solid var(--border-inverse); border-radius:var(--radius-md); background:rgba(5,9,11,.35); padding:10px; }
.bp-stage::before{ content:''; position:absolute; inset:0; pointer-events:none; background-image:linear-gradient(rgba(168,194,200,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(168,194,200,.05) 1px,transparent 1px); background-size:40px 40px; }
.bp-stage__tag{ position:absolute; top:14px; left:16px; font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-inverse-muted); display:flex; gap:8px; align-items:center; z-index:1; }
.bp-stage__tag i{ width:6px; height:6px; border-radius:50%; background:var(--accent-emerald); box-shadow:0 0 0 3px rgba(18,131,107,.25); }
.bp-svg{ position:relative; width:100%; height:auto; display:block; }
.bp-ring{ fill:none; stroke:rgba(168,194,200,.14); stroke-dasharray:2 6; }
.bp-path{ fill:none; stroke-width:2; opacity:.14; transition:opacity var(--t-diag) var(--e), stroke-width var(--t-diag); }
.bp-path--cap{ stroke:var(--accent-emerald); } .bp-path--capa{ stroke:#A8BDD7; } .bp-path--com{ stroke:var(--accent-gold); stroke-dasharray:5 5; }
.bp-pk{ fill:none; stroke-width:4; stroke-linecap:round; stroke-dasharray:3 97; opacity:0; transition:opacity var(--t-diag); animation:bpPk 3.6s linear infinite; }
.bp-pk--rev{ animation-direction:reverse; }
@keyframes bpPk{ from{ stroke-dashoffset:100; } to{ stroke-dashoffset:0; } }
.bp-node{ opacity:.35; transition:opacity var(--t-diag) var(--e); }
.bp-node .core{ fill:#0B1416; stroke:rgba(168,194,200,.55); stroke-width:1.2; transition:stroke var(--t-diag), fill var(--t-diag); }
.bp-node .peri{ fill:none; stroke:rgba(168,194,200,.4); stroke-dasharray:3 4; opacity:0; transform-box:fill-box; transform-origin:center; transform:scale(.7); transition:opacity var(--t-diag) var(--e), transform var(--t-diag) var(--e); }
.bp-node .code{ fill:var(--accent-gold); font-size:9px; }
.bp-node .name{ fill:#fff; font-size:12px; font-family:var(--font-sans); font-weight:600; letter-spacing:0; }
.bp-node .tag{ fill:var(--accent-emerald); font-size:9px; opacity:0; transition:opacity var(--t-diag); }
.bp-node--anchor{ opacity:1; }
.bp-node--anchor .core{ fill:var(--brand-ink); stroke:var(--accent-emerald); stroke-width:1.5; }
.bp[data-lens="1"] .bp-node.on1, .bp[data-lens="2"] .bp-node.on2, .bp[data-lens="3"] .bp-node.on3{ opacity:1; }
.bp[data-lens="1"] .bp-node.on1 .peri{ opacity:1; transform:scale(1); stroke:var(--accent-emerald); }
.bp[data-lens="1"] .bp-node.on1 .tag.t1, .bp[data-lens="3"] .bp-node.on3 .tag.t3{ opacity:1; }
.bp[data-lens="1"] .bp-node.on1 .core{ stroke:var(--accent-emerald); }
.bp[data-lens="2"] .bp-path{ opacity:1; }
.bp[data-lens="2"] .bp-pk{ opacity:1; }
.bp[data-lens="3"] .bp-path--cap{ opacity:1; stroke-width:2.5; }
.bp[data-lens="3"] .bp-pk--cap{ opacity:1; }
.bp[data-lens="3"] .bp-node.on3 .core{ stroke:var(--accent-gold); }

      { title: 'Businesses & projects', line: 'Bring a real need: to grow, trade or build.', who: 'SMEs & projects', cap: ['It starts with a real business need.', 'A manufacturer needs working capital. A solar project needs funding. The need comes first, not the product.'] },
      { title: 'BWCI designs the route', line: 'Works out the right structure to fund it.', who: 'BWCI', cap: ['BWCI designs the route.', 'BWCI works out the right structure: which platform, which partners, what kind of capital. It designs the route; it does not lend directly.'] },
      { title: 'Platforms & partners', line: 'Licensed platforms deliver. Partners bring tech and know-how.', who: 'Platforms & partners', cap: ['Platforms and partners bring the tools.', 'Licensed platforms deliver the finance. Partners add technology, data and expertise.'] },
      { title: 'Investors', line: 'Put long-term capital to work in the real economy.', who: 'Investors', cap: ['Investors put capital to work.', 'Pension funds, DFIs and family offices invest through those platforms, into real businesses they can see.'] },
      { title: 'Growth & better outcomes', line: 'Jobs, trade and resilience, and the loop starts again.', who: 'Outcomes', cap: ['Growth, then the loop repeats.', 'Businesses grow, trade and hire. What works is reused, so each new connection is easier than the last.'] }
    ];
  const $ = s => root.querySelector(s), $$ = s => [...root.querySelectorAll(s)];
  const seqs = {full:[0,1,2,3,4],sme:[0,1,2,4],investor:[1,2,3,4],partner:[1,2,4]};
  const state = {lens:'full',step:0,playing:!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches,visible:true,mech:0,part:0};
  const measure = $('.lp-measure'), nav = $('.nav'), burger = $('.nav__burger'), drawer = $('.nav__drawer');
  function menu(open) { drawer.hidden=!open; burger.setAttribute('aria-expanded',String(open)); burger.setAttribute('aria-label',open?'Close menu':'Open menu'); }
  burger.addEventListener('click',()=>menu(drawer.hidden));
  drawer.addEventListener('click',e=>{if(e.target.closest('a'))menu(false)});
  window.addEventListener('resize',()=>{if(window.innerWidth>=1024)menu(false)},{passive:true});
  root.addEventListener('click',e=>{
    const a=e.target.closest('a[href^="#"]'); if(!a)return;
    const target=root.getElementById(decodeURIComponent(a.getAttribute('href').slice(1))); if(!target)return;
    e.preventDefault(); menu(false);
    window.scrollTo({top:Math.max(0,window.scrollY+target.getBoundingClientRect().top-nav.getBoundingClientRect().height),behavior:'smooth'});
  });
  function renderLoop() {
    const seq=seqs[state.lens], item=LPN[state.step];
    $$('.lp-lens button').forEach((b,i)=>{const on=['full','sme','investor','partner'][i]===state.lens;b.classList.toggle('on',on);b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1});
    $$('.lp-node,.lp-mnode').forEach(b=>{const i=Number(b.className.match(/--(\d)/)?.[1])-1;b.classList.remove('is-on','is-dim','is-off');b.classList.add(i===state.step?'is-on':seq.includes(i)?'is-dim':'is-off');b.setAttribute('aria-pressed',String(i===state.step))});
    $$('.lp-cap__eb').forEach(x=>x.textContent=`Step ${state.step+1} of 5`);
    $$('.lp-cap__t').forEach(x=>x.textContent=item.cap[0]);
    $$('.lp-cap__b').forEach(x=>x.textContent=item.cap[1]);
    $('.lp-ring__h').textContent=state.playing?'Auto-playing':'Paused';
    $('.lp-card__who').textContent=`${String(state.step+1).padStart(2,'0')} · ${item.who}`;
    $('.lp-card > .lp-plat').hidden=state.step!==2;
    $$('.lp-prog').forEach(p=>{
      p.querySelectorAll('.lp-prog__d').forEach(b=>b.remove());
      const hint=p.querySelector('.lp-prog__hint');
      seq.forEach(i=>{const b=document.createElement('button');b.type='button';b.className='lp-prog__d'+(i===state.step?' on':'');b.setAttribute('aria-label',`Go to step ${i+1}`);b.dataset.step=i;hint.before(b)});
      p.hidden=!state.playing;
    });
    $$('.lp-play').forEach(b=>b.hidden=state.playing);
  }
  function pick(i) {state.step=i;state.playing=false;renderLoop()}
  $$('.lp-lens button').forEach((b,i)=>b.addEventListener('click',()=>{state.lens=['full','sme','investor','partner'][i];state.step=seqs[state.lens][0];state.playing=!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;renderLoop()}));
  root.addEventListener('click',e=>{
    const n=e.target.closest('.lp-node,.lp-mnode');if(n)return pick(Number(n.className.match(/--(\d)/)?.[1])-1);
    const d=e.target.closest('.lp-prog__d');if(d)return pick(Number(d.dataset.step));
    if(e.target.closest('.lp-play')){state.playing=true;renderLoop()}
  });
  const timer=setInterval(()=>{if(!mount.isConnected){clearInterval(timer);return}if(!state.playing||!state.visible)return;const seq=seqs[state.lens];state.step=seq[(seq.indexOf(state.step)+1)%seq.length];renderLoop()},4000);
  if('IntersectionObserver' in window){
    new IntersectionObserver(es=>state.visible=es[0].isIntersecting,{threshold:.15}).observe($('#blueprint'));
    const reveal=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('rv-in');reveal.unobserve(x.target)}}),{threshold:.15});
    $$('.rv').forEach(x=>reveal.observe(x));
  }else $$('.rv').forEach(x=>x.classList.add('rv-in'));
  function sizeLoop(){const w=measure.clientWidth,wide=w>=900;$('.lp-stage').hidden=!wide;$('.lp-mob').hidden=wide;if(wide){const s=Math.min(1,w/1120);$('.lp-stage').style.height=`${Math.round(740*s)}px`;$('.lp-canvas').style.transform=`translateX(-50%) scale(${s})`}}
  sizeLoop();if('ResizeObserver' in window)new ResizeObserver(sizeLoop).observe(measure);else window.addEventListener('resize',sizeLoop,{passive:true});
  renderLoop();
  function mechanism(i){if(state.mech===i)return;state.mech=i;$$('.cm-item').forEach((x,n)=>x.classList.toggle('cm-item--on',n===i));$('.cm-diagram').dataset.mech=i}
  $$('.cm-item').forEach((x,i)=>['click','mouseenter','focus'].forEach(t=>x.addEventListener(t,()=>mechanism(i))));
  function participant(i){
    if(state.part===i)return;state.part=i;
    $$('.pt-node').forEach((x,n)=>{x.classList.toggle('pt-node--on',n===i);x.setAttribute('aria-pressed',String(n===i))});
    $$('.pt-spoke').forEach((x,n)=>x.classList.toggle('pt-spoke--on',n===i));
    $$('.pt-port').forEach((x,n)=>x.classList.toggle('pt-port--on',n===i));
    const p=PARTS[i],panel=$('.pt-panel');
    panel.querySelector('.pt-panel__c').textContent=p.code;panel.querySelector('.pt-panel__t').textContent=p.title;
    const rel=panel.querySelector('.pt-rel');rel.textContent=p.rel;rel.classList.toggle('pt-rel--partner',!!p.partner);
    panel.querySelector('.pt-fields').replaceChildren(...p.fields.map(([l,v])=>{const d=document.createElement('div'),a=document.createElement('span'),b=document.createElement('p');d.className='pt-f';a.className='pt-f__l';a.textContent=l;b.className='pt-f__t';b.textContent=v;d.append(a,b);return d}));
    panel.replaceWith(panel.cloneNode(true));
  }
  $$('.pt-node').forEach((x,i)=>['click','mouseenter','focus'].forEach(t=>x.addEventListener(t,()=>participant(i))));
}
bootEcosystemWidget();
document.addEventListener("DOMContentLoaded", bootEcosystemWidget, {once:true});
document.addEventListener("hydrationDone", bootEcosystemWidget);
</script>
